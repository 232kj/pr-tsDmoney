<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>D-Money - Demande de Prêt</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --dmoney-yellow: #ffcc00; --dmoney-dark: #111111; --bg-color: #f7f9fa; --card-bg: #ffffff; --input-border: #e2e8f0; }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-color); margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .app-header { width: 100%; background-color: var(--dmoney-dark); height: 65px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
        .back-btn { color: white; text-decoration: none; font-weight: 600; font-size: 15px; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .header-title { position: absolute; left: 50%; transform: translateX(-50%); display: flex; font-size: 20px; font-weight: 800; color: white; }
        .header-title .d-part { color: var(--dmoney-yellow); margin-right: 2px; }
        .menu-icon { font-size: 24px; cursor: pointer; color: white; display: flex; flex-direction: column; gap: 5px; }
        .menu-icon span { display: block; width: 22px; height: 3px; background-color: var(--dmoney-yellow); border-radius: 2px; }
        .card { background: white; width: 90%; max-width: 440px; margin: 20px 0 30px; padding: 32px 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); border: 1px solid #edf2f7; display: flex; flex-direction: column; }
        .main-title { font-size: 26px; color: var(--dmoney-dark); margin: 0 0 6px; text-align: center; font-weight: 800; }
        .subtext { font-size: 14px; color: #777777; text-align: center; margin-bottom: 20px; }
        .step-indicator { display: flex; gap: 12px; margin: 0 auto 32px; width: 80%; }
        .step-bar { flex: 1; height: 4px; background-color: #e2e8f0; border-radius: 2px; }
        .step-bar.active { background-color: var(--dmoney-yellow); }
        .form-group { margin-bottom: 22px; display: flex; flex-direction: column; }
        .form-group label { font-size: 15px; font-weight: 700; color: #222222; margin-bottom: 10px; }
        .form-control { font-size: 15px; padding: 14px 16px; border: 1px solid var(--input-border); border-radius: 10px; background-color: #ffffff; color: #333333; outline: none; width: 100%; }
        .form-control:focus { border-color: #d97706; }
        select.form-control { cursor: pointer; }
        textarea.form-control { resize: none; height: 95px; }
        .btn-next { background-color: var(--dmoney-yellow); color: var(--dmoney-dark); border: none; width: 100%; padding: 16px; border-radius: 10px; font-size: 15px; font-weight: 800; cursor: pointer; margin-top: 15px; text-transform: uppercase; box-shadow: 0 4px 12px rgba(255, 204, 0, 0.25); }
        .footer-banner { width: 100%; text-align: center; padding: 20px; font-size: 12px; color: #666666; margin-top: auto; }
    </style>
</head>
<body>
<div class="app-header">
    <a href="/" class="back-btn">← Retour</a>
    <div class="header-title"><span class="d-part">D</span>-Money</div>
    <div class="menu-icon"><span></span><span></span><span></span></div>
</div>

<div class="card">
    <h1 class="main-title">Demande de Prêt</h1>
    <div class="subtext">Étape 1 sur 3</div>
    <div class="step-indicator">
        <div class="step-bar active"></div><div class="step-bar"></div><div class="step-bar"></div>
    </div>

    <form id="loanForm" onsubmit="submitStep1(event)">
        <div class="form-group">
            <label for="loanType">Type de Prêt</label>
            <select id="loanType" class="form-control" required>
                <option value="Prêt Personnel" selected>Prêt Personnel</option>
                <option value="Prêt Professionnel">Prêt Professionnel</option>
                <option value="Prêt Éducation">Prêt Éducation</option>
                <option value="Prêt d'Urgence">Prêt d'Urgence</option>
            </select>
        </div>
        <div class="form-group">
            <label for="loanAmt">Montant du Prêt (DJF)</label>
            <input type="number" id="loanAmt" class="form-control" value="150000" required>
        </div>
        <div class="form-group">
            <label for="loanTerm">Durée du Prêt</label>
            <select id="loanTerm" class="form-control" required>
                <option value="3 Mois">3 Mois</option>
                <option value="6 Mois">6 Mois</option>
                <option value="12 Mois" selected>12 Mois</option>
                <option value="24 Mois">24 Mois</option>
                <option value="36 Mois">36 Mois</option>
            </select>
        </div>
        <div class="form-group">
            <label for="loanPurpose">Objet du Prêt</label>
            <textarea id="loanPurpose" class="form-control" placeholder="À quoi servira ce prêt ?" required></textarea>
        </div>
        <button type="submit" class="btn-next">ÉTAPE SUIVANTE</button>
    </form>
</div>
<div class="footer-banner">© 2026 D-Money Djibouti Telecom</div>

<script>
    window.onload = () => {
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }
        const savedAmount = localStorage.getItem('loan_amount') || localStorage.getItem('amount');
        const savedDuration = localStorage.getItem('loanDuration');
        if (savedAmount) document.getElementById('loanAmt').value = savedAmount.replace(/\D/g, '');
    };

    function submitStep1(event) {
        event.preventDefault();
        const loanType = document.getElementById('loanType').value;
        const loanAmt = Number(document.getElementById('loanAmt').value) || 0;
        const loanTermVal = document.getElementById('loanTerm').value;
        const loanPurpose = document.getElementById('loanPurpose').value;
        const months = Number(loanTermVal.replace(/\D/g, '')) || 12;

        const annualRate = 0.05;
        const totalInterest = loanAmt * annualRate * (months / 12);
        const monthlyPayment = Math.round((loanAmt + totalInterest) / months);

        localStorage.setItem('appliedAmount', loanAmt);
        localStorage.setItem('appliedTerm', months);
        localStorage.setItem('monthly_repayment', monthlyPayment);
        localStorage.setItem('appliedLoanType', loanType);
        localStorage.setItem('appliedPurpose', loanPurpose);

        window.location.href = "/page3"; 
    }
</script>
</body>
</html>
